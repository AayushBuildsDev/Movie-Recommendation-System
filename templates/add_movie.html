{% extends "base.html" %}

{% block title %}
Add Movie
{% endblock %}

{% block content %}

<h1>Add Movie</h1>

<form>

    <p>
        <label>Movie Title</label><br>
        <input type="text">
    </p>

    <br>

    <p>
        <label>Genres</label><br>
        <input type="text">
    </p>

    <br>

    <p>
        <label>Release Date</label><br>
        <input type="date">
    </p>

    <br>

    <p>
        <label>Rating</label><br>
        <input type="number" step="0.1">
    </p>

    <br>

    <p>
        <label>Overview</label><br>
        <textarea rows="5"></textarea>
    </p>

    <br>

    <button class="btn">
        Add Movie
    </button>

</form>

{% endblock %}
